<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Paygate Sandbox</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: linear-gradient(135deg, var(--bg-primary), var(--bg-secondary));
    }
    
    .login-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 2.5rem;
      width: 100%;
      max-width: 400px;
    }
    
    .login-logo {
      text-align: center;
      margin-bottom: 2rem;
    }
    
    .login-title {
      text-align: center;
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    
    .login-subtitle {
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }
    
    .login-error {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      color: var(--error);
      padding: 0.75rem 1rem;
      border-radius: var(--radius);
      margin-bottom: 1rem;
      font-size: 0.875rem;
      display: none;
      text-align: center;
    }
    
    .login-error.show {
      display: block;
    }
    
    .password-input-wrapper {
      position: relative;
    }
    
    .password-toggle {
      position: absolute;
      right: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-secondary);
      padding: 0.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.7;
      transition: opacity 0.2s;
    }
    
    .password-toggle:hover {
      opacity: 1;
    }
    
    .password-toggle svg {
      width: 18px;
      height: 18px;
    }
    
    .form-input {
      padding-right: 2.5rem;
    }
    
    .login-error-icon {
      margin-bottom: 0.5rem;
      display: block;
      text-align: center;
    }
    
    .login-error-icon img {
      width: 120px;
      height: 120px;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-logo">
        <div class="logo" style="justify-content: center;">
          <div class="logo-text">Paygate Sandbox</div>
        </div>
      </div>
      
      <p class="login-subtitle">Enter password to access the dashboard</p>
      
      <div class="login-error" id="login-error">
        <div class="login-error-icon" id="login-error-icon"></div>
        <span id="login-error-text">Wrong password! Shoo shoo, try again!</span>
      </div>
      
      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="password-input-wrapper">
            <input type="password" id="password" class="form-input" 
                   placeholder="Enter password" autofocus required>
            <button type="button" class="password-toggle" id="password-toggle" onclick="togglePasswordVisibility()" title="Show/Hide password">
              <svg id="password-eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
          Login
        </button>
      </form>
      
    </div>
  </div>

  <script>
    // Check if already logged in
    if (localStorage.getItem('admin_password')) {
      window.location.href = '/dashboard';
    }
    
    function togglePasswordVisibility() {
      const passwordInput = document.getElementById('password');
      const eyeIcon = document.getElementById('password-eye-icon');
      
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeIcon.innerHTML = `
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
          <line x1="1" y1="1" x2="23" y2="23"></line>
        `;
      } else {
        passwordInput.type = 'password';
        eyeIcon.innerHTML = `
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        `;
      }
    }
    
    async function handleLogin(event) {
      event.preventDefault();
      
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('login-error');
      
      try {
        const response = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });
        
        // Parse JSON response
        let data;
        try {
          if (!response.ok) {
            // For 401 (invalid password), show funny message with shoo GIF
            if (response.status === 401) {
              const errorIcon = document.getElementById('login-error-icon');
              const errorText = document.getElementById('login-error-text');
              if (errorIcon) {
                errorIcon.innerHTML = '<img src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExbHE4cHNndGhub29tb2ExZjJzMWt4dDZxNXhwZHp4ZmhocnY0ZHF3eCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/l1J9u3TZfpmeDLkD6/giphy.gif" alt="Shoo away">';
              }
              if (errorText) errorText.textContent = 'Wrong password! Shoo shoo, try again!';
              errorEl.classList.add('show');
              document.getElementById('password').select();
              return;
            }
            // For other errors, show internal server error
            const errorIcon = document.getElementById('login-error-icon');
            const errorText = document.getElementById('login-error-text');
            if (errorIcon) {
              errorIcon.innerHTML = '<span style="font-size: 1.5rem;">⚠️</span>';
            }
            if (errorText) errorText.textContent = 'Internal server error';
            errorEl.classList.add('show');
            document.getElementById('password').select();
            return;
          }
          
          const contentType = response.headers.get('content-type');
          if (contentType && contentType.includes('application/json')) {
            const text = await response.text();
            if (text.trim()) {
              data = JSON.parse(text);
            }
          }
        } catch (error) {
          // For any parsing errors, show internal server error
          const errorIcon = document.getElementById('login-error-icon');
          const errorText = document.getElementById('login-error-text');
          if (errorIcon) {
            errorIcon.innerHTML = '<span style="font-size: 1.5rem;">⚠️</span>';
          }
          if (errorText) errorText.textContent = 'Internal server error';
          errorEl.classList.add('show');
          document.getElementById('password').select();
          return;
        }
        
        if (data && data.success) {
          // Store password in localStorage
          localStorage.setItem('admin_password', password);
          
          // Also set as cookie for server-side requests
          document.cookie = `admin_password=${encodeURIComponent(password)}; path=/; max-age=${60*60*24*30}`; // 30 days
          
          // Redirect to dashboard
          window.location.href = '/dashboard';
        } else {
          // Invalid password - show funny message with shoo GIF
          const errorIcon = document.getElementById('login-error-icon');
          const errorText = document.getElementById('login-error-text');
          if (errorIcon) {
            errorIcon.innerHTML = '<img src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExbHE4cHNndGhub29tb2ExZjJzMWt4dDZxNXhwZHp4ZmhocnY0ZHF3eCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/l1J9u3TZfpmeDLkD6/giphy.gif" alt="Shoo away">';
          }
          if (errorText) errorText.textContent = 'Wrong password! Shoo shoo, try again!';
          errorEl.classList.add('show');
          document.getElementById('password').select();
        }
      } catch (error) {
        // For any other errors, show internal server error
        const errorIcon = document.getElementById('login-error-icon');
        const errorText = document.getElementById('login-error-text');
        if (errorIcon) {
          errorIcon.innerHTML = '<span style="font-size: 1.5rem;">⚠️</span>';
        }
        if (errorText) errorText.textContent = 'Internal server error';
        errorEl.classList.add('show');
        document.getElementById('password').select();
      }
    }
  </script>
</body>
</html>
